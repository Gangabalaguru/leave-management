<div class="container mt-5">

  <h2 class="text-center text-primary mb-4">Leave Requests</h2>
  
  <div class="text-center mb-4">

    <button class="btn btn-warning me-2"
            (click)="loadData('PENDING')">
      Pending
    </button>

    <button class="btn btn-success me-2"
            (click)="loadData('APPROVED')">
      Approved
    </button>

    <button class="btn btn-danger"
            (click)="loadData('REJECTED')">
      Rejected
    </button>

  </div>

  <p class="text-center fw-bold">
    Showing: {{ currentStatus }} ({{ requests.length }})
  </p>

  <!-- ✅ TABLE -->
  <table class="table table-hover table-bordered text-center"
         *ngIf="requests.length > 0">

    <thead class="table-dark">
      <tr>
        <th>Employee</th>
        <th>Start</th>
        <th>End</th>
        <th>Status</th>
        <th *ngIf="currentStatus === 'PENDING'">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let r of requests">

        <td>{{ r.employeeId }}</td>
        <td>{{ r.startDate }}</td>
        <td>{{ r.endDate }}</td>

        <!-- ✅ Color Status -->
        <td>
          <span class="badge"
            [ngClass]="{
              'bg-warning text-dark': r.status==='PENDING',
              'bg-success': r.status==='APPROVED',
              'bg-danger': r.status==='REJECTED'
            }">
            {{ r.status }}
          </span>
        </td>

        <!-- ✅ Show buttons only for pending -->
        <td *ngIf="currentStatus === 'PENDING'">

          <button class="btn btn-success btn-sm me-2"
                  (click)="approve(r.id)">
            Approve
          </button>

          <button class="btn btn-danger btn-sm"
                  (click)="reject(r.id)">
            Reject
          </button>

        </td>

      </tr>
    </tbody>
  </table>

  <!-- ✅ EMPTY -->
  <p class="text-center text-muted" *ngIf="requests.length === 0">
    No records available
  </p>

</div>
